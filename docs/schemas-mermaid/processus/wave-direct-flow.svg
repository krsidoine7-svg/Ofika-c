<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1659.68 882" width="1659.68" height="882" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#3d59a1;--accent:#7aa2f7;--muted:#565f89;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 30%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.4, 0 4.8" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="4.8" refX="8" refY="2.4" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.4, 0 4.8" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<rect x="268.28000000000003" y="478" width="1361.4" height="354" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="268.28000000000003" y="478" width="271.2" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="274.28000000000003" y="487" dy="0.35em" font-size="11" font-weight="600" fill="var(--_text-sec)">alt [CAS A : Reçu Valide (Admin valide)]</text>
<line x1="268.28000000000003" y1="704" x2="1629.68" y2="704" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<text x="276.28000000000003" y="718" font-size="11" font-weight="400" fill="var(--_text-muted)">[CAS B : Reçu Invalide / Illisible (Admin rejette)]</text>
<line x1="318.28000000000003" y1="70" x2="318.28000000000003" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="507.23" y1="70" x2="507.23" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="732.955" y1="70" x2="732.955" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="919.355" y1="70" x2="919.355" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="1102.18" y1="70" x2="1102.18" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="1270.7050000000002" y1="70" x2="1270.7050000000002" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="1492.855" y1="70" x2="1492.855" y2="852" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line x1="318.28000000000003" y1="90" x2="507.23" y2="90" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="412.755" y="84" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">1. Choix Wave Direct &amp; validation commande</text>
<line x1="507.23" y1="130" x2="732.955" y2="130" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="620.0925" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">2. POST /api/orders/create (payment_method: &#39;wave&#39;)</text>
<line x1="732.955" y1="170" x2="1270.7050000000002" y2="170" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1001.8300000000002" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">3. Commande créée (payment_status: &#39;pending&#39;)</text>
<line x1="318.28000000000003" y1="210" x2="919.355" y2="210" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="618.8175" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">4. Virement sur le lien/QR Wave Marchand</text>
<line x1="318.28000000000003" y1="250" x2="507.23" y2="250" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="412.755" y="244" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">5. Upload de la capture d&#39;écran / reçu de paiement</text>
<line x1="507.23" y1="290" x2="1102.18" y2="290" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="804.705" y="284" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">6. Téléversement image du reçu (profile-images/receipts/...)</text>
<line x1="1102.18" y1="330" x2="507.23" y2="330" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="804.705" y="324" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">7. URL publique de l&#39;image (receipt_url)</text>
<line x1="507.23" y1="370" x2="732.955" y2="370" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="620.0925" y="364" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">8. POST /api/payments/receipt/upload (receipt_url)</text>
<line x1="732.955" y1="410" x2="1270.7050000000002" y2="410" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1001.8300000000002" y="404" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">9. UPDATE orders SET payment_status=&#39;processing&#39;, metadata.receipt_url=...</text>
<line x1="1270.7050000000002" y1="450" x2="1492.855" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="1381.7800000000002" y="444" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">10. L&#39;Admin consulte le reçu sur /dashboard/admin/orders</text>
<line x1="1492.855" y1="518" x2="732.955" y2="518" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1112.905" y="512" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">11. Clic sur &quot;Valider le Reçu&quot;</text>
<line x1="732.955" y1="558" x2="1270.7050000000002" y2="558" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1001.8300000000002" y="552" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">12. PATCH /api/admin/orders (payment_status: &#39;succeeded&#39;, status: &#39;paid&#39;)</text>
<polyline points="1270.7050000000002,598 1300.7050000000002,598 1300.7050000000002,618 1270.7050000000002,618" fill="none" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1306.7050000000002" y="608" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Trigger PostgreSQL notifie le client (&quot;Paiement confirmé !&quot;)</text>
<line x1="1270.7050000000002" y1="668" x2="318.28000000000003" y2="668" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="794.4925000000001" y="662" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">13. Le statut passe à &quot;Payée&quot; (Bouton Payer masqué définitivement)</text>
<line x1="1492.855" y1="732" x2="732.955" y2="732" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1112.905" y="726" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">11. Clic sur &quot;Marquer comme Échoué&quot;</text>
<line x1="732.955" y1="772" x2="1270.7050000000002" y2="772" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="1001.8300000000002" y="766" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">12. PATCH /api/admin/orders (payment_status: &#39;failed&#39;, status: &#39;failed&#39;)</text>
<line x1="1270.7050000000002" y1="812" x2="318.28000000000003" y2="812" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
<text x="794.4925000000001" y="806" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">13. Le bouton &quot;Payer / Resoumettre&quot; réapparaît pour réessayer</text>
<rect x="30" y="414" width="576.5600000000001" height="27" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<polygon points="600.5600000000001,414 606.5600000000001,420 600.5600000000001,420" fill="var(--_inner-stroke)" />
<text x="318.28000000000003" y="427.5" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Sur /dashboard/orders, le bouton &quot;Payer&quot; est remplacé par le badge &quot;Reçu en cours de vérification&quot;</text>
