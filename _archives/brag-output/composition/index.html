<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000; /* Fond noir */
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: white;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Texts */
      .scene-text {
        position: absolute;
        opacity: 0;
        text-align: center;
        font-size: 80px;
        font-weight: 700;
        max-width: 1600px;
        line-height: 1.2;
      }
      .highlight { color: #FF9E8A; } /* Orange Ofika */
      .gold { color: #FFD700; } /* Or */

      /* 3D Card */
      #card-wrapper {
        position: absolute;
        width: 850px;
        height: 550px;
        opacity: 0;
        perspective: 1500px;
        transform: scale(0.5) translateY(200px);
      }
      #card-container {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
      }
      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 24px;
        box-shadow: 0 40px 60px rgba(255, 158, 138, 0.15);
      }
      .card-front {
        /* Recto.svg is front */
      }
      .card-back {
        /* Verso.svg is back, so it needs to be rotated 180 by default */
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <!-- Audio tracks -->
    <audio id="bgm" data-start="0" data-track-index="0" data-volume="1" src="assets/current_audio.mp3"></audio>
    <audio id="sfx-whoosh1" data-start="4.5" data-track-index="1" data-volume="0.5" src="assets/whoosh.wav"></audio>
    <audio id="sfx-impact1" data-start="9.5" data-track-index="2" data-volume="0.8" src="assets/impact.wav"></audio>
    <audio id="sfx-whoosh2" data-start="13.0" data-track-index="3" data-volume="0.5" src="assets/whoosh.wav"></audio>
    <audio id="sfx-whoosh3" data-start="21.0" data-track-index="4" data-volume="0.5" src="assets/whoosh.wav"></audio>
    <audio id="sfx-impact2" data-start="45.0" data-track-index="5" data-volume="0.8" src="assets/impact.wav"></audio>
    
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      
      <!-- Scene 1: 0 - 10s -->
      <h1 id="text1" class="scene-text" data-start="0" data-duration="60">Combien de cartes de visite <span class="highlight">avez-vous perdues</span> cette année ?</h1>
      <h1 id="text2" class="scene-text" data-start="0" data-duration="60">Pire… combien ont fini <span class="highlight">à la poubelle</span> ?</h1>
      
      <!-- Scene 2: 10 - 20s (With Logo) -->
      <div id="text3" class="scene-text" data-start="0" data-duration="60" style="display:flex; flex-direction:column; align-items:center;">
        <img src="assets/design carte/logo ofika.svg" style="width:300px; margin-bottom:40px;">
        <h1>Voici <span class="highlight">Ofika</span>.<br>Le futur de votre identité professionnelle.</h1>
      </div>
      
      <!-- 3D Card showing up -->
      <div id="card-wrapper" data-start="0" data-duration="60">
        <div id="card-container">
          <div class="card-face card-front"><img src="assets/design carte/recto.svg" style="width:100%; height:100%; object-fit: contain;"></div>
          <div class="card-face card-back"><img src="assets/design carte/verso.svg" style="width:100%; height:100%; object-fit: contain;"></div>
        </div>
      </div>
      
      <!-- Scene 3: 20 - 35s -->
      <h1 id="text4" class="scene-text" data-start="0" data-duration="60" style="bottom: 80px;">Un simple <span class="highlight">geste</span> suffit.<br>Un simple <span class="gold">scan QR</span>.</h1>
      
      <!-- Scene 4: 35 - 45s -->
      <h1 id="text5" class="scene-text" data-start="0" data-duration="60">Mise à jour en <span class="highlight">temps réel</span>.<br>Fini les réimpressions.</h1>
      
      <!-- Scene 5: 45 - 60s -->
      <h1 id="text6" class="scene-text" data-start="0" data-duration="60">Démarquez-vous dès aujourd'hui.<br><span class="highlight" style="font-size:120px;">ofika.ci</span></h1>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      
      // text1: 0 to 4s
      tl.fromTo("#text1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1 }, 0.5);
      tl.to("#text1", { opacity: 0, y: -50, duration: 0.5 }, 4.0);
      
      // text2: 4.5 to 9s
      tl.fromTo("#text2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1 }, 4.5);
      tl.to("#text2", { opacity: 0, scale: 1.2, duration: 0.5 }, 9.0);
      
      // text3 (Logo): 9.5 to 14s
      tl.fromTo("#text3", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1 }, 9.5);
      tl.to("#text3", { opacity: 0, y: -100, duration: 1 }, 13.5);
      
      // Card appears at 13s, flips at 20s, zooms out at 30s
      tl.to("#card-wrapper", { opacity: 1, scale: 1, y: 0, duration: 2, ease: "power3.out" }, 13.0);
      // Continuous floating effect
      tl.to("#card-wrapper", { y: -20, duration: 3, yoyo: true, repeat: 10, ease: "sine.inOut" }, 15.0);
      // Flip to back (verso)
      tl.to("#card-container", { rotationY: 180, duration: 2, ease: "power2.inOut" }, 21.0);
      // Rotate back a bit for dynamic view
      tl.to("#card-container", { rotationY: 200, rotationX: 10, duration: 8, ease: "none" }, 24.0);
      
      // text4: 21 to 30s
      tl.fromTo("#text4", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1 }, 21.0);
      tl.to("#text4", { opacity: 0, duration: 0.5 }, 29.5);
      
      // Flip front (recto) and zoom back
      tl.to("#card-container", { rotationY: 0, rotationX: 0, duration: 1.5, ease: "power2.inOut" }, 32.0);
      
      // text5: 35 to 42s
      tl.fromTo("#text5", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1 }, 35.0);
      tl.to("#text5", { opacity: 0, duration: 1 }, 42.0);
      
      // Card fades out
      tl.to("#card-wrapper", { opacity: 0, scale: 1.5, duration: 1.5 }, 43.0);
      
      // text6 (End): 45 to 60s
      tl.fromTo("#text6", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 2, ease: "back.out(1.5)" }, 45.0);
      tl.to("#text6", { opacity: 0, duration: 1 }, 59.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
