<text x="371.8125" y="324" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">7. Redirection client vers GeniusPay Checkout</text>
<line x1="70" y1="370" x2="688.95" y2="370" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="379.475" y="364" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">8. Saisie numéro Mobile Money / Carte &amp; Validation OTP</text>
<line x1="688.95" y1="410" x2="484.675" y2="410" stroke="var(--_line)" stroke-width="0.75" marker-end="url(#seq-arrow)" />
<text x="586.8125" y="404" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">9. Webhook POST /api/webhooks/geniuspay (payment.success)</text>
