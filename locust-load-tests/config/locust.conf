# Fichier de configuration par défaut pour les tests Locust — Ofika-c
# Ces paramètres seront appliqués automatiquement si vous lancez "locust" sans arguments.

# Fichier de scénario de test par défaut
locustfile = scenarios/ofika_public.py

# Hôte cible par défaut (environnement local Next.js)
host = http://localhost:3000

# Nombre d'utilisateurs simulés par défaut
users = 10

# Taux d'apparition des utilisateurs par seconde
spawn-rate = 2

# Durée d'exécution du test (ex: 5m pour 5 minutes, ou commentez pour tourner indéfiniment)
# run-time = 5m
